<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 76" width="900" height="76" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><clipPath id="c"><rect x="2" y="2" width="896" height="72" rx="16"/></clipPath>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fcd12a" stop-opacity="0"/><stop offset=".5" stop-color="#fcd12a" stop-opacity=".28"/><stop offset="1" stop-color="#fcd12a" stop-opacity="0"/></linearGradient></defs>
<style>
@keyframes sh{0%{transform:translateX(-300px)}100%{transform:translateX(960px)}}
.sh{animation:sh 4s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.p{transform-box:fill-box;transform-origin:center;animation:pu 1.6s ease-in-out infinite}
@keyframes sl{0%{opacity:0;transform:translateX(-20px)}100%{opacity:1;transform:translateX(0)}}
.t{animation:sl .8s cubic-bezier(.2,.8,.2,1) 1 both}
@keyframes gr{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.u{transform-origin:84px 0;animation:gr 1s cubic-bezier(.2,.8,.2,1) .3s 1 both}
</style>
<rect x="2" y="2" width="896" height="72" rx="16" fill="#0b0b0f" stroke="#fcd12a" stroke-width="2"/>
<g clip-path="url(#c)"><rect class="sh" x="0" y="0" width="300" height="76" fill="url(#sh)"/></g>
<g fill="#fcd12a"><rect class="p" x="28" y="22" width="12" height="12"/><rect class="p" x="44" y="22" width="12" height="12" style="animation-delay:.4s"/><rect class="p" x="28" y="38" width="12" height="12" style="animation-delay:1.2s"/><rect class="p" x="44" y="38" width="12" height="12" style="animation-delay:.8s"/></g>
<text class="t" x="84" y="49" font-size="30" font-weight="800" letter-spacing="5" fill="#fcd12a" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">TECH STACK</text>
</svg>